<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Jaime Rodrigo Lagunas Parra">
<meta name="generator" content="Explorador de Partido — desarrollado por Jaime Rodrigo Lagunas Parra, Pumas UNAM Inteligencia Deportiva">
<title>Pumas UNAM — Inteligencia Deportiva</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__LOGO_B64__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F4F2; --card:#FFFFFF; --paper-alt:#EEF0EC;
    --ink:#12181E; --ink-soft:#4B5560; --ink-faint:#8B93A0;
    --navy:#0C2A4E; --navy-soft:#294C74; --gold:#B9902E; --gold-soft:#E7D9AF;
    --win:#2F6B4F; --loss:#9C3B34; --teal:#3C7A89; --purple:#7A5C9E;
    --line:#DADDD6; --line-strong:#B9BEB6;
    --turf-a:#3E7A50; --turf-b:#376E48; --turf-line:#FFFFFF;
    --shadow: 0 1px 2px rgba(12,42,78,0.05), 0 10px 28px rgba(12,42,78,0.08);
    --fnt: 'Helvetica Neue', Helvetica, Arial, 'Inter', sans-serif;
    --fnt-mono: 'JetBrains Mono', 'Consolas', monospace;
    /* Condensed sports-style display face — used for headlines, scoreline, tabs.
       Body copy stays on --fnt (Helvetica) for readability and UNAM's own style guide. */
    --fnt-display: 'Oswald', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--fnt); -webkit-font-smoothing:antialiased; }
  .doc{ max-width:1360px; margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line); background:var(--paper); }
  .wrap{ padding:22px clamp(16px,3vw,42px) 54px; position:relative; }

  .topbar{ background:var(--navy); color:#EDEFEF; padding:8px clamp(16px,3vw,42px); display:flex; justify-content:center; font-family:var(--fnt-mono); font-size:10px; letter-spacing:0.14em; font-weight:700;}

  header{ display:flex; justify-content:space-between; align-items:center; padding:20px 0 16px; border-bottom:4px solid var(--navy); margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .brandmark{ display:flex; align-items:center; gap:14px; }
  .brandmark img.crest{ width:52px; height:auto; display:block; }
  h1{ font-family:var(--fnt-display); font-weight:600; font-size:24px; margin:0; color:var(--navy); letter-spacing:0.01em; text-transform:uppercase; }
  .eyebrow{ font-family:var(--fnt-display); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:3px;}
  .meta{ font-family:var(--fnt-mono); font-size:10.5px; color:var(--ink-faint); text-align:right; line-height:1.7;}
  .meta b{ color:var(--navy-soft); }

  .controls{ display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; margin-bottom:18px; }
  .ctrl-group{ display:flex; align-items:center; gap:8px; }
  .ctrl-label{ font-family:var(--fnt-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:700; margin-right:2px;}
  .seg{ display:flex; background:var(--paper-alt); border:1px solid var(--line-strong); border-radius:2px; padding:2px; gap:2px; }
  .seg button{ border:none; background:transparent; padding:7px 14px; border-radius:1px; cursor:pointer; font-family:var(--fnt-display); font-size:12px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600; color:var(--ink-soft); transition:all .15s; }
  .seg button.active{ background:var(--navy); color:#fff; box-shadow:var(--shadow); }
  .seg button:hover:not(.active){ color:var(--navy); }
  .seg.gold button.active{ background:var(--gold); color:#fff; }
  .seg.mode button.active{ background:#20324a; color:#fff; }

  .export-btn{
    background:var(--navy); color:#fff; border:none; border-radius:2px;
    font-family:var(--fnt-display); font-size:12px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
    padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .export-btn:hover{ background:var(--navy-soft); }

  .layout{ display:grid; grid-template-columns:1fr 280px; gap:18px; }
  .layout.full{ grid-template-columns:1fr; }
  .pitch-card{ background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); padding:20px; position:relative; }
  .side-card{ background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:14px; height:fit-content; position:relative; }

  .view-tabs{ display:flex; gap:4px; margin-bottom:2px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .view-tabs button{ border:none; background:none; padding:9px 14px; cursor:pointer; font-family:var(--fnt-display); font-size:12.5px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600; color:var(--ink-faint); border-bottom:3px solid transparent; margin-bottom:-1px; }
  .view-tabs button.active{ color:var(--navy); border-bottom-color:var(--gold); }

  .view-caption{ font-size:12px; color:var(--ink-faint); margin:10px 0 4px; font-style:italic; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; align-items:center; }
  .chip-row .chip-hint{ font-family:var(--fnt-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-right:4px;}
  .chip{ border:1px solid var(--line-strong); background:#fff; color:var(--ink-soft); font-family:var(--fnt); font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:14px; cursor:pointer; transition:all .12s; }
  .chip.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip:hover:not(.on){ border-color:var(--navy-soft); color:var(--navy); }

  svg.pitch{ width:100%; height:auto; display:block; border-radius:2px; }

  .player-banner{ display:none; align-items:center; gap:13px; padding:12px 16px; background:var(--paper-alt); border-radius:4px; margin-bottom:12px; }
  .player-banner .avatar-wrap{ flex-shrink:0; }
  .player-banner .pname{ font-family:var(--fnt); font-weight:800; font-size:17px; color:var(--navy); }
  .player-banner .ppos{ font-family:var(--fnt-mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em;}

  .time-panel{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .time-row{ display:flex; align-items:center; gap:14px; }
  .play-btn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--navy); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
  .play-btn:hover{ background:var(--navy-soft); }
  .slider-wrap{ flex:1; position:relative; height:36px; }
  .slider-track{ position:absolute; top:16px; left:0; right:0; height:4px; background:var(--line-strong); border-radius:2px;}
  .slider-range{ position:absolute; top:16px; height:4px; background:var(--gold); border-radius:2px; }
  input[type=range]{ position:absolute; top:0; width:100%; margin:0; appearance:none; background:transparent; pointer-events:none; height:36px; }
  input[type=range]::-webkit-slider-thumb{ appearance:none; pointer-events:auto; width:18px; height:18px; border-radius:50%; background:var(--navy); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.3); cursor:pointer; margin-top:9px; }
  input[type=range]::-moz-range-thumb{ pointer-events:auto; width:18px; height:18px; border-radius:50%; background:var(--navy); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.3); cursor:pointer; }
  .time-readout{ font-family:var(--fnt-mono); font-size:13px; font-weight:700; color:var(--navy); width:96px; text-align:center; flex-shrink:0;}

  .side-title{ font-family:var(--fnt-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:700;}
  .roster-list{ display:flex; flex-direction:column; gap:2px; max-height:560px; overflow-y:auto; }
  .roster-row{ display:flex; align-items:center; gap:9px; padding:6px 4px; border-radius:4px; cursor:default; }
  .roster-row.clickable{ cursor:pointer; }
  .roster-row.clickable:hover{ background:var(--paper-alt); }
  .roster-row.selected{ background:var(--gold-soft); }
  .roster-row .num{ width:24px; height:24px; border-radius:50%; background:var(--paper-alt); color:var(--navy); display:flex; align-items:center; justify-content:center; font-family:var(--fnt-mono); font-size:11px; font-weight:700; flex-shrink:0; }
  .roster-row.selected .num{ background:var(--navy); color:#fff; }
  .roster-row .nm{ font-size:12.5px; font-weight:600; color:var(--ink); flex:1; }
  .roster-row .val{ font-family:var(--fnt-mono); font-size:12px; font-weight:700; color:var(--gold); }
  .roster-row.dim{ opacity:0.35; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .dot.ring{ background:transparent; border:2px solid; }

  .statsheet{ display:none; }
  .statsheet.show{ display:block; }
  .sheet-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 26px; }
  .sheet-group-title{ font-family:var(--fnt-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--gold); font-weight:700; margin:16px 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .sheet-row{ margin-bottom:9px; }
  .sheet-row-top{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px; }
  .sheet-row-top .lbl{ color:var(--ink-soft); }
  .sheet-row-top .v{ font-family:var(--fnt-mono); font-weight:700; color:var(--navy); }
  .sheet-bar-track{ height:6px; background:var(--paper-alt); border-radius:3px; overflow:hidden; }
  .sheet-bar-fill{ height:100%; background:var(--navy); border-radius:3px; }

  .resumen{ display:none; }
  .resumen.show{ display:block; }
  .resumen-head{ display:flex; align-items:center; justify-content:center; gap:26px; padding:6px 0 26px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .resumen-team{ display:flex; flex-direction:column; align-items:center; gap:6px; width:180px; }
  .resumen-team .rt-name{ font-family:var(--fnt-display); font-weight:600; font-size:16px; color:var(--navy); text-align:center; text-transform:uppercase; letter-spacing:0.02em;}
  .resumen-score{ font-family:var(--fnt-mono); font-size:22px; font-weight:800; color:var(--ink-faint); letter-spacing:0.02em; }
  .resumen-score.has-score{ font-size:32px; color:var(--navy); }
  .pen-note{ font-size:13px; font-weight:600; color:var(--ink-faint); text-align:center; margin-top:2px; }
  .rs-score .pen-note{ font-size:11px; }
  .resumen-score, .rs-score{ text-align:center; }
  .resumen-cat-title{ font-family:var(--fnt-display); font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); font-weight:600; margin:26px 0 12px; border-bottom:2px solid var(--paper-alt); padding-bottom:6px;}
  .resumen-cat-title:first-child{ margin-top:0; }
  .rrow{ display:grid; grid-template-columns:1fr 220px 1fr; align-items:center; gap:10px; padding:5px 0; }
  .rrow .rlabel{ text-align:center; font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .rval{ font-family:var(--fnt-mono); font-weight:700; font-size:12.5px; width:38px; text-align:center; flex-shrink:0; }
  .rval.p{ color:var(--navy); }
  .rval.r{ color:var(--gold); }
  .rside{ display:flex; align-items:center; gap:8px; }
  .rside.left{ justify-content:flex-end; }
  .rside.right{ justify-content:flex-start; }
  .rbar-track{ flex:1; height:7px; background:var(--paper-alt); border-radius:4px; overflow:hidden; position:relative; }
  .rbar-fill{ height:100%; position:absolute; top:0; border-radius:4px; }
  .rbar-fill.p{ right:0; background:var(--navy); }
  .rbar-fill.r{ left:0; background:var(--gold); }

  .credit-tag{ position:absolute; bottom:6px; right:10px; font-family:var(--fnt-mono); font-size:7px; letter-spacing:0.02em; color:var(--ink-faint); opacity:0.4; pointer-events:none; user-select:none; white-space:nowrap; }

  footer.colophon{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-family:var(--fnt-mono); font-size:10px; color:var(--ink-faint); flex-wrap:wrap; gap:6px;}

  @media (max-width: 920px){ .layout{ grid-template-columns:1fr; } .sheet-grid{ grid-template-columns:1fr; } .rrow{ grid-template-columns:1fr 140px 1fr; } }

  /* ===================================================================
     REPORTE PDF — página fija, independiente de lo que esté en pantalla.
     Se genera con buildReport() al presionar "Exportar PDF" y solo se
     hace visible en el contexto de impresión (@media print).
     =================================================================== */
  #reportRoot{ display:none; }
  @media print{
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body{ background:#fff; }
    .doc{ display:none !important; }
    #reportRoot{ display:block !important; }
    @page{ margin:16mm 14mm 14mm 14mm; }
  }

  .report-page{ font-family:var(--fnt); color:var(--ink); page-break-after:always; position:relative; }
  .report-page:last-child{ page-break-after:auto; }
  .report-watermark{
    position:fixed; top:38%; left:50%; width:220px; height:220px;
    transform:translate(-50%,-50%); opacity:0.05; pointer-events:none; z-index:0;
  }
  .report-watermark img{ width:100%; height:100%; }
  .report-page > *{ position:relative; z-index:1; }
  .report-internal-tag{
    position:fixed; top:6mm; right:14mm; font-family:var(--fnt-mono); font-size:8px; font-weight:700;
    letter-spacing:0.12em; color:var(--gold); border:1px solid var(--gold); border-radius:2px;
    padding:2px 7px; text-transform:uppercase; z-index:1;
  }
  .report-head{ display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--navy); padding-bottom:12px; margin-bottom:18px; }
  .report-head .rh-brand{ display:flex; align-items:center; gap:12px; }
  .report-head .rh-brand img{ width:38px; height:auto; }
  .report-head .rh-brand .rh-eyebrow{ font-family:var(--fnt-display); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  .report-head .rh-brand .rh-title{ font-family:var(--fnt-display); font-size:18px; font-weight:600; color:var(--navy); text-transform:uppercase; letter-spacing:0.01em; }
  .report-head .rh-meta{ text-align:right; font-family:var(--fnt-mono); font-size:9.5px; color:var(--ink-faint); line-height:1.6; }
  .report-section-title{ font-family:var(--fnt-display); font-size:14px; letter-spacing:0.04em; text-transform:uppercase; color:var(--navy); font-weight:600; margin:0 0 4px; }
  .report-section-sub{ font-family:var(--fnt-mono); font-size:10px; color:var(--ink-faint); margin-bottom:16px; }
  .report-foot{ margin-top:20px; padding-top:8px; border-top:1px solid #ccc; font-family:var(--fnt-mono); font-size:8.5px; color:var(--ink-faint); display:flex; justify-content:space-between; }

  .report-scoreline{ display:flex; align-items:center; justify-content:center; gap:22px; padding:10px 0 20px; }
  .report-scoreline .rs-team{ font-family:var(--fnt-display); font-weight:600; font-size:15px; color:var(--navy); text-transform:uppercase; width:210px; text-align:center; }
  .report-scoreline .rs-vs{ font-family:var(--fnt-mono); font-size:16px; color:var(--ink-faint); }
  .report-scoreline .rs-score{ font-family:var(--fnt-mono); font-size:26px; font-weight:700; color:var(--navy); letter-spacing:0.04em; }

  .report-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px 22px; }
  .report-graphic{ break-inside:avoid; }
  .report-graphic .rg-title{ font-family:var(--fnt-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); font-weight:700; margin-bottom:6px;}
  .report-graphic svg{ width:100%; height:auto; border:1px solid #ddd; }
  .report-graphic .rg-caption{ font-size:9.5px; font-style:italic; color:var(--ink-faint); margin:6px 0 4px; }
  .report-graphic .rg-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:9px; }
  .report-graphic .rg-legend .legend-item{ font-size:9px; gap:4px; }

  .report-players-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px 16px; }
  .report-player{ break-inside:avoid; border:1px solid #ddd; padding:8px; }
  .report-player .rp-head{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .report-player .rp-num{ width:18px; height:18px; border-radius:50%; background:var(--navy); color:#fff; font-family:var(--fnt-mono); font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .report-player .rp-name{ font-family:var(--fnt); font-size:10.5px; font-weight:700; color:var(--ink); }
  .report-player .rp-pos{ font-family:var(--fnt-mono); font-size:8px; color:var(--ink-faint); text-transform:uppercase; }
  .report-player svg{ width:100%; height:auto; }
  .report-player-pitch{ position:relative; width:100%; aspect-ratio: 100 / 65; }
  .report-player-pitch canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .report-player-pitch svg{ position:absolute; inset:0; width:100%; height:100%; }
  .report-legend{ display:flex; gap:16px; margin-top:14px; font-size:9.5px; color:var(--ink-soft); font-family:var(--fnt-mono); }
  .report-legend .rl-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }

</style>
</head>
<body>

<div class="doc">
  <div class="topbar"><span>PUMAS UNAM · INTELIGENCIA DEPORTIVA</span></div>
  <div class="wrap">

    <header>
      <div class="brandmark">
        <img class="crest" src="data:image/png;base64,__LOGO_B64__" alt="Pumas UNAM">
        <div><div class="eyebrow">Inteligencia Deportiva</div><h1>Explorador de Partido</h1></div>
      </div>
      <div class="meta">FUENTE: OPTA MA2 / MA3 — SDAPI</div>
    </header>

    <div class="controls">
      <div class="ctrl-group" id="catCtrlGroup">
        <span class="ctrl-label">Categoría</span>
        <div class="seg" id="catSeg"></div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Equipo</span>
        <div class="seg gold" id="followTeamSeg"></div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Jornada</span>
        <div class="seg" id="matchSeg"></div>
      </div>
      <div class="ctrl-group" id="teamCtrlGroup">
        <span class="ctrl-label">Ver también</span>
        <div class="seg" id="teamSeg"></div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Modo</span>
        <div class="seg mode" id="modeSeg"></div>
      </div>
      <div class="ctrl-group" style="margin-left:auto;">
        <button class="export-btn" id="exportPdfBtn">⬇ Exportar PDF</button>
      </div>
    </div>

    <div class="layout" id="layoutGrid">
      <div class="pitch-card">

        <div class="resumen" id="resumenSheet"></div>

        <div id="explorerBlock">
          <div class="view-tabs" id="viewTabs"></div>
          <div class="view-caption" id="viewCaption"></div>
          <div class="chip-row" id="chipRow"></div>

          <div class="player-banner" id="playerBanner">
            <div class="avatar-wrap" id="pbAvatar"></div>
            <div><div class="pname" id="pbName"></div><div class="ppos" id="pbPos"></div></div>
          </div>

          <svg class="pitch" id="pitchSvg" viewBox="0 0 100 65" preserveAspectRatio="xMidYMid meet"></svg>

          <div class="statsheet" id="statSheet"></div>

          <div class="time-panel" id="timePanel">
            <div class="time-row">
              <button class="play-btn" id="playBtn">▶</button>
              <div class="slider-wrap">
                <div class="slider-track"></div>
                <div class="slider-range" id="sliderRange"></div>
                <input type="range" id="minFrom" min="0" max="98" value="0">
                <input type="range" id="minTo" min="0" max="98" value="98">
              </div>
              <div class="time-readout" id="timeReadout">0'–FIN</div>
            </div>
          </div>
        </div>
        <span class="credit-tag">Pumas UNAM · Inteligencia Deportiva</span>
      </div>

      <div class="side-card" id="sideCard">
        <div>
          <div class="side-title" id="sideTitle">PASES POR JUGADOR</div>
          <div class="roster-list" id="rosterList"></div>
        </div>
        <div>
          <div class="side-title" style="margin-bottom:8px;">LEYENDA</div>
          <div class="legend" id="legendBox"></div>
        </div>
      </div>
    </div>

    <footer class="colophon">
      <span>PUMAS UNAM · INTELIGENCIA DEPORTIVA</span>
      <span id="matchFooter"></span>
    </footer>
  </div>

function pickDefaultTeam(matchId){

// All distinct teams (id + name) that appear across the matches of a given category.
function teamsInCategory(cat){
  const map = {};
  matchesInCategory(cat).forEach(id=>{
    const m = DATA[id];
    m.teamOrder.forEach(tid=>{ map[tid] = m.teams[tid].name; });
  });
  return Object.entries(map).map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name));
}
function pickDefaultFollowTeam(cat){
  const teams = teamsInCategory(cat);
  const found = teams.find(t => t.name.includes(TRACKED_TEAM_NAME));
  return found ? found.id : (teams[0] ? teams[0].id : null);
}

function matchesForTeam(cat, teamId){
  return matchesInCategory(cat).filter(id => DATA[id].teamOrder.includes(teamId));

// ---- Heat canvas (proper smooth thermal blobs — green/yellow/orange/red, like a real heatmap) ----
function heatColor(t){
  const stops = [
    [0.00, [46,107,68]],
    [0.35, [150,200,60]],
    [0.60, [235,210,40]],
    [0.80, [240,130,30]],
    [1.00, [210,30,30]],
  ];
  for(let i=0;i<stops.length-1;i++){
    const [t0,c0]=stops[i], [t1,c1]=stops[i+1];
    if(t>=t0 && t<=t1){
      const f=(t-t0)/(t1-t0);
      return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
    }
  }
  return stops[stops.length-1][1];
}
function renderPlayerHeatCanvas(points, cw, ch){
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  if(!ctx) return canvas;
  ctx.fillStyle = '#2f6b44';
  ctx.fillRect(0,0,cw,ch);
  if(!points.length) return canvas;

  const density = document.createElement('canvas');
  density.width = cw; density.height = ch;
  const dctx = density.getContext('2d');
  const r = Math.max(cw,ch) * 0.11;
  points.forEach(p=>{
    const cx = (p.x/100)*cw;
    const cy = (1 - p.y/100)*ch; // same flip convention as py()
    const g = dctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g;
    dctx.beginPath(); dctx.arc(cx,cy,r,0,Math.PI*2); dctx.fill();
  });
  const dimg = dctx.getImageData(0,0,cw,ch);
  const cimg = ctx.getImageData(0,0,cw,ch);
  for(let i=0;i<dimg.data.length;i+=4){
    const a = dimg.data[i+3]/255;
    if(a<=0.03) continue;
    const t = Math.min(1, a);
    const [rc,gc,bc] = heatColor(t);
    const mix = Math.min(1, t*1.2);
    cimg.data[i]   = cimg.data[i]*(1-mix) + rc*mix;
    cimg.data[i+1] = cimg.data[i+1]*(1-mix) + gc*mix;
    cimg.data[i+2] = cimg.data[i+2]*(1-mix) + bc*mix;
  }
  ctx.putImageData(cimg,0,0);
  return canvas;
}
function px(x){ return x; }
// NOTE: Opta's y-axis runs opposite to on-screen "right flank" when attacking left→right,
// so we flip it here — without this, right-sided players render on the left and vice versa.
function py(y){ return 65 - (y/100)*65; }

// ==================== FILTER HELPERS ====================
function inWindow(m){ return m>=state.minFrom && m<=state.minTo; }
function currentTeamData(){ return DATA[state.jornada].teams[state.team]; }
function sameShirt(a,b){ return a!==null && a!==undefined && b!==null && b!==undefined && String(a)===String(b); }

function roleOf(td, shirt){
  const meta = td.roster[shirt];
  if(!meta) return 'starter';
  if(meta.pos === 'Goalkeeper') return 'gk';
  if(meta.pos === 'Substitute') return 'sub';
  return 'starter';
}
function roleStyle(role){
  if(role==='gk') return { fill:'#B9902E', stroke:'#fff', dash:null, shape:'square' };
  if(role==='sub') return { fill:'#0C2A4E', stroke:'#fff', dash:'1.1,1.1', shape:'circle', fadeOpacity:0.62 };
  return { fill:'#0C2A4E', stroke:'#fff', dash:null, shape:'circle' };
}

function separateNodes(nodeArr, iterations){
  iterations = iterations || 220;
  const pad = 0.5;
  for(let it=0; it<iterations; it++){
    let moved=false;
    for(let i=0;i<nodeArr.length;i++){
      for(let j=i+1;j<nodeArr.length;j++){
        const A=nodeArr[i], B=nodeArr[j];
        let dx = B.rx-A.rx, dy = B.ry-A.ry;
        let dist = Math.sqrt(dx*dx+dy*dy);
        const minDist = A.r + B.r + pad;
        if(dist < minDist){
          moved = true;
          if(dist < 0.001){ dx = (Math.random()-0.5); dy = (Math.random()-0.5); dist = Math.sqrt(dx*dx+dy*dy)||0.01; }
          const overlap = (minDist - dist) / 2;
          const ux = dx/dist, uy = dy/dist;
          A.rx -= ux*overlap; A.ry -= uy*overlap;
          B.rx += ux*overlap; B.ry += uy*overlap;
          A.rx = Math.min(96, Math.max(4, A.rx)); B.rx = Math.min(96, Math.max(4, B.rx));
          A.ry = Math.min(61, Math.max(4, A.ry)); B.ry = Math.min(61, Math.max(4, B.ry));
        }
      }
    }
    if(!moved) break;
  }
}

function activeChips(view){
  return chipState[view] || (CHIP_CONFIG[view] ? CHIP_CONFIG[view].default.slice() : []);
}

// ==================== TEAM VIEWS ====================
function renderNetwork(layer, td){
  const chips = activeChips('network');
  const onlyCompleted = chips.includes('completed');
  const passesAll = td.passes.filter(p=>inWindow(p.m));
  const posBasis = onlyCompleted ? passesAll.filter(p=>p.o===1) : passesAll;

  const posSum = {}, posCount = {}, edgeCount = {};
  posBasis.forEach(p=>{
    if(!p.p) return;
    posSum[p.p] = posSum[p.p] || [0,0]; posSum[p.p][0]+=p.x; posSum[p.p][1]+=p.y;
    posCount[p.p] = (posCount[p.p]||0)+1;
  });
  passesAll.forEach(p=>{
    if(p.o===1 && p.p && p.r){
      const key = [p.p,p.r].sort((a,b)=>a-b).join('-');
      edgeCount[key] = (edgeCount[key]||0)+1;
    }
  });
  const maxN = Math.max(1, ...Object.values(posCount));
  const maxEdge = Math.max(1, ...Object.values(edgeCount));

  const nodeArr = Object.keys(posCount).map(shirt=>{
    const x = posSum[shirt][0]/posCount[shirt], y = posSum[shirt][1]/posCount[shirt];
    const n = posCount[shirt];
    return { shirt, rx: px(x), ry: py(y), r: 2.2 + (n/maxN)*2.6, n };
  });
  separateNodes(nodeArr);
  const nodeMap = {};
  nodeArr.forEach(nd=>{ nodeMap[nd.shirt] = nd; });

  Object.entries(edgeCount).forEach(([key,cnt])=>{
    const [a,b] = key.split('-');
    if(!nodeMap[a] || !nodeMap[b]) return;
    const w = 0.3 + (cnt/maxEdge)*2.2;
    const line = el('line',{ x1:nodeMap[a].rx, y1:nodeMap[a].ry, x2:nodeMap[b].rx, y2:nodeMap[b].ry,
      stroke:'#0C2A4E', 'stroke-width':w, opacity:0.35+(cnt/maxEdge)*0.35, 'stroke-linecap':'round' });
    const na = td.roster[a], nb = td.roster[b];
    titled(line, `${na?na.name:a} ↔ ${nb?nb.name:b}: ${cnt} pase(s)`);
    layer.appendChild(line);
  });
  nodeArr.forEach(nd=>{
    const role = roleOf(td, nd.shirt);
    const style = roleStyle(role);
    const meta = td.roster[nd.shirt];
    let shape;
    if(style.shape==='square'){
      const s = nd.r*1.7;
      shape = el('rect',{x:nd.rx-s/2, y:nd.ry-s/2, width:s, height:s, rx:0.8, fill:style.fill, stroke:style.stroke,'stroke-width':0.5, filter:'url(#dropShadow)'});
    } else {
      shape = el('circle',{cx:nd.rx, cy:nd.ry, r:nd.r, fill:style.fill, stroke:style.stroke,'stroke-width':0.5, filter:'url(#dropShadow)'});
      if(style.dash){ shape.setAttribute('stroke-dasharray', style.dash); shape.setAttribute('fill-opacity', style.fadeOpacity); shape.setAttribute('stroke-width', 0.7); }
    }
    titled(shape, `${meta?meta.name:nd.shirt} — ${nd.n} pase(s)`);
    layer.appendChild(shape);
    const t = el('text',{x:nd.rx, y:nd.ry+1.1, 'text-anchor':'middle', 'font-size':2.7, fill:'#fff','font-family':'var(--fnt-mono)','font-weight':700, 'pointer-events':'none'});
    t.textContent = nd.shirt; layer.appendChild(t);
  });
  const metric = {}; nodeArr.forEach(nd=>{ metric[nd.shirt] = { n: nd.n }; });
  return { type:'network', metric, label:'Pases' };
}

function zonePoints(td, filterShirt, view){
  const chips = activeChips(view || 'zones');
  let pts = [];
  if(chips.includes('pass')) pts = pts.concat(td.passes.filter(p=>inWindow(p.m) && (!filterShirt || sameShirt(p.p,filterShirt))).map(p=>({x:p.x,y:p.y})));
  if(chips.includes('def')) pts = pts.concat(td.defActions.filter(d=>inWindow(d.m) && (!filterShirt || sameShirt(d.p,filterShirt))).map(d=>({x:d.x,y:d.y})));
  if(chips.includes('shot')) pts = pts.concat(td.shots.filter(s=>inWindow(s.m) && (!filterShirt || sameShirt(s.p,filterShirt))).map(s=>({x:s.x,y:s.y})));
  return pts;
}
function renderZones(layer, pts){
  const COLS=6, ROWS=5;
  const grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
  pts.forEach(p=>{
    let cx = Math.min(COLS-1, Math.max(0,Math.floor(p.x/100*COLS)));
    let cy = Math.min(ROWS-1, Math.max(0,Math.floor(p.y/100*ROWS)));
    grid[cy][cx]++;
  });
  const max = Math.max(1, ...grid.flat());
  const cw = 100/COLS, ch = 65/ROWS;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const v = grid[r][c];
      const t = v/max;
      if(v>0){
        const ry = (ROWS-1-r)*ch;
        const rect = el('rect',{x:c*cw, y:ry, width:cw, height:ch, fill:mixColor(t), 'fill-opacity':0.35+t*0.45, stroke:'#fff','stroke-width':0.12});
        titled(rect, `${v} acción(es) en esta zona`);
        layer.appendChild(rect);
        const txt = el('text',{x:c*cw+cw/2, y:ry+ch/2+1, 'text-anchor':'middle', 'font-size':3.6, fill:'#ffffff', 'font-family':'var(--fnt-mono)','font-weight':700, style:'paint-order:stroke;stroke:rgba(12,42,78,0.55);stroke-width:0.9px;', 'pointer-events':'none'});
        txt.textContent = v; layer.appendChild(txt);
      }
    }
  }
}
function mixColor(t){
  const c1=[210,225,90], c2=[12,42,78];
  const r=Math.round(c1[0]+(c2[0]-c1[0])*t), g=Math.round(c1[1]+(c2[1]-c1[1])*t), b=Math.round(c1[2]+(c2[2]-c1[2])*t);
  return `rgb(${r},${g},${b})`;
}

const SHOT_STYLE = {
  goal:  { fill: '#B9902E', r:3.1, stroke:'#fff', sw:0.65, dash:null },   // gol — dorado, sólido, el más grande
  saved: { fill: '#2E6DA4', r:2.35, stroke:'#fff', sw:0.4, dash:null },  // atajado — azul sólido
  post:  { fill: 'none', r:2.1, stroke:'#D98B2B', sw:0.75, dash:null }, // poste — anillo naranja
  miss:  { fill: 'none', r:1.7, stroke:'#9AA2AC', sw:0.5, dash:'0.9,0.9' }, // fuera — anillo gris punteado, el más chico
};
const SHOT_RES_ES = { goal:'Gol', saved:'Atajado', post:'Poste', miss:'Fuera' };

function renderShots(layer, shots, view, td){
  const chips = activeChips(view || 'shots');
  shots.filter(s=>chips.includes(s.res)).forEach(s=>{
    const st = SHOT_STYLE[s.res];
    const c = el('circle',{cx:px(s.x), cy:py(s.y), r:st.r, fill:st.fill, stroke:st.stroke, 'stroke-width':st.sw, opacity:0.95, filter:'url(#dropShadow)'});
    if(st.dash) c.setAttribute('stroke-dasharray', st.dash);
    const meta = td && td.roster[s.p];
    titled(c, `${meta?meta.name:(s.p||'—')} · min ${s.m} · ${SHOT_RES_ES[s.res]||s.res}`);
    layer.appendChild(c);
  });
}

// ==================== DUELOS Y RECUPERACIONES ====================
const RECOVERY_TYPES = ['recovery','interception','clearance'];
const DUEL_TYPES = ['tackle','aerial','dispossessed'];
const DUEL_TYPE_ES = { tackle:'Entrada', aerial:'Duelo aéreo', dispossessed:'Pérdida por presión' };

function renderDuelosRecuperaciones(layer, defs, view, td){
  const chips = activeChips(view || 'defense');
  if(chips.includes('recov')){
    const pts = defs.filter(d=>RECOVERY_TYPES.includes(d.t)).map(d=>({x:d.x,y:d.y}));
    renderRecoveryBubbles(layer, pts);
  }
  if(chips.includes('duel')){
    const duels = defs.filter(d=>DUEL_TYPES.includes(d.t));
    duels.forEach(d=>{
      const won = d.t==='dispossessed' ? false : d.o===1;
      const color = won ? WIN : LOSS;
      const c = el('circle',{cx:px(d.x), cy:py(d.y), r:1.6, fill:color, stroke:'#fff','stroke-width':0.35, opacity:0.92});
      const meta = td && td.roster[d.p];
      titled(c, `${meta?meta.name:(d.p||'—')} · min ${d.m} · ${DUEL_TYPE_ES[d.t]||d.t} · ${won?'ganado':'perdido'}`);
      layer.appendChild(c);
    });
  }
}
function renderRecoveryBubbles(layer, pts){
  const COLS=5, ROWS=4;
  const grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
  pts.forEach(p=>{
    let cx = Math.min(COLS-1, Math.max(0,Math.floor(p.x/100*COLS)));
    let cy = Math.min(ROWS-1, Math.max(0,Math.floor(p.y/100*ROWS)));
    grid[cy][cx]++;
  });
  const max = Math.max(1, ...grid.flat());
  const cw = 100/COLS, ch = 65/ROWS;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const v = grid[r][c];
      if(v===0) continue;
      const ry = (ROWS-1-r)*ch;
      const cxp = c*cw+cw/2, cyp = ry+ch/2;
      const rad = 1.6 + (v/max)*5.2;
      const bubble = el('circle',{cx:cxp, cy:cyp, r:rad, fill:NAVY, opacity:0.28+(v/max)*0.32, stroke:NAVY,'stroke-width':0.3});
      titled(bubble, `${v} recuperación(es) en esta zona`);
      layer.appendChild(bubble);
      const txt = el('text',{x:cxp, y:cyp+1.1, 'text-anchor':'middle', 'font-size':3.2, fill:'#fff','font-family':'var(--fnt-mono)','font-weight':700, 'pointer-events':'none'});
      txt.textContent = v;
      layer.appendChild(txt);
    }
  }
}

// ==================== PLAYER VIEWS ====================
function renderPlayerPassMap(layer, td, shirt){
  const chips = activeChips('pmap');
  const passes = td.passes.filter(p=>inWindow(p.m) && sameShirt(p.p,shirt) && p.ex!==null)
    .filter(p=> (p.o===1 && chips.includes('ok')) || (p.o!==1 && chips.includes('bad')) );
  // white halo underneath every line so it reads on ANY background — plain turf
  // or a busy heatmap (yellow/orange/red would otherwise swallow a pale line).
  passes.forEach(p=>{
    layer.appendChild(el('line',{ x1:px(p.x), y1:py(p.y), x2:px(p.ex), y2:py(p.ey),
      stroke:'#ffffff', 'stroke-width':1.15, opacity:0.8, 'stroke-linecap':'round' }));
  });
  passes.forEach(p=>{
    const ok = p.o===1;
    const line = el('line',{ x1:px(p.x), y1:py(p.y), x2:px(p.ex), y2:py(p.ey),
      stroke: ok? '#1F9D55':'#D93B3B', 'stroke-width':0.6, opacity:0.95,
      'marker-end': ok? 'url(#arrowGreen)':'url(#arrowRed)' });
    titled(line, `min ${p.m} · ${ok?'completado':'fallido'}`);
    layer.appendChild(line);
  });
  passes.forEach(p=>{
    layer.appendChild(el('circle',{cx:px(p.x), cy:py(p.y), r:0.95, fill:'#0C2A4E', stroke:'#fff','stroke-width':0.3}));
  });
}

function renderResumen(){
  const jornada = state.jornada;
  const match = SUMMARY[jornada];
  const teams = DATA[jornada].teams;
  const sheet = document.getElementById('resumenSheet');
  const [idA, idB] = match.teamOrder;

  let html = `<div class="resumen-head">
    <div class="resumen-team"><div class="rt-name">${match.teamNames[idA]}</div></div>
    <div class="resumen-score${match.score ? ' has-score':''}">${scoreText(match, idA, idB)}</div>
    <div class="resumen-team"><div class="rt-name">${match.teamNames[idB]}</div></div>
  </div>`;

  match.categories.forEach(cat=>{
    html += `<div class="resumen-cat-title">${catEs(cat.cat)}</div>`;
    cat.rows.forEach(row=>{
      const va = row[idA] || 0, vb = row[idB] || 0;
      const maxv = Math.max(va, vb, 1);
      const pPct = Math.min(100, (va/maxv)*100);
      const rPct = Math.min(100, (vb/maxv)*100);
      html += `<div class="rrow">
        <div class="rside left"><span class="rval p">${va}</span><div class="rbar-track"><div class="rbar-fill p" style="width:${pPct}%;"></div></div></div>
        <div class="rlabel">${row.label}</div>
        <div class="rside right"><div class="rbar-track"><div class="rbar-fill r" style="width:${rPct}%;"></div></div><span class="rval r">${vb}</span></div>
      </div>`;
    });
  });
  sheet.innerHTML = html;
}
// Texto del marcador, con penales aparte si el partido se definió así
// (frecuente en categorías U21/U19 cuando hay empate).
function scoreText(match, idA, idB){
  if(!match.score) return 'vs';
  let txt = `${match.score[idA]} – ${match.score[idB]}`;
  if(match.score.penalties){
    txt += `<div class="pen-note">(${match.score.penalties[idA]}-${match.score.penalties[idB]} pen)</div>`;
  }
  return txt;
}

function catEs(c){
  const map = { 'Posesion y pase':'Posesión y pase', 'Produccion ofensiva':'Producción ofensiva',
    'Fase defensiva':'Fase defensiva', 'Duelos':'Duelos', 'Disciplina':'Disciplina', 'Portero':'Portero' };
  return map[c] || c;
}

// ==================== MAIN RENDER ====================
const svgEl = document.getElementById('pitchSvg');
const TEAM_VIEWS = [['network','Red de pases'],['zones','Campograma'],['shots','Disparos'],['defense','Duelos y recuperaciones']];
const PLAYER_VIEWS = [['pmap','Mapa de pases'],['pzones','Heatmap individual'],['pshots','Disparos'],['pdefense','Duelos y recuperaciones'],['ficha','Ficha completa']];

function render(){
  syncActive('catSeg', state.category);
  syncActive('followTeamSeg', state.followTeam);
  syncActive('matchSeg', state.jornada);
  syncActive('teamSeg', state.team);
  syncActive('modeSeg', state.mode);

  const isResumen = state.mode==='resumen';
  document.getElementById('layoutGrid').classList.toggle('full', isResumen);
  document.getElementById('sideCard').style.display = isResumen ? 'none':'flex';
  document.getElementById('explorerBlock').style.display = isResumen ? 'none':'block';
  document.getElementById('resumenSheet').classList.toggle('show', isResumen);
  document.getElementById('teamCtrlGroup').style.display = isResumen ? 'none':'flex';

  const teamNames = MATCH_IDS.length ? DATA[state.jornada].teams : {};
  document.getElementById('matchFooter').textContent = DATA[state.jornada].label;

  if(isResumen){ renderResumen(); return; }

  syncActive('viewTabs', state.view);
  document.getElementById('viewCaption').textContent = VIEW_CAPTIONS[state.view] || '';
  renderChipRow();

  const td = currentTeamData();
  const isPlayerMode = state.mode==='jugador';
  document.getElementById('playerBanner').style.display = isPlayerMode ? 'flex':'none';

  if(isPlayerMode && state.player){
    const meta = td.roster[state.player];
    const role = roleOf(td, state.player);
    document.getElementById('pbAvatar').innerHTML = avatarSVG(role, 46);
    document.getElementById('pbName').textContent = meta ? meta.name : '';
    document.getElementById('pbPos').textContent = meta ? posEs(meta.pos) : '';
  }

  let result = null;
  if(state.view!=='ficha'){
    const layer = drawPitchBase(svgEl);
    if(!isPlayerMode){
      if(state.view==='network') result = renderNetwork(layer, td);
      else if(state.view==='zones') renderZones(layer, zonePoints(td, null, 'zones'));
      else if(state.view==='shots'){ const s = td.shots.filter(x=>inWindow(x.m)); renderShots(layer, s, 'shots', td); result={type:'list', metric: countBy(s.filter(x=>activeChips('shots').includes(x.res)),'p'), label:'Disparos'}; }
      else if(state.view==='defense'){ const d = td.defActions.filter(x=>inWindow(x.m)); renderDuelosRecuperaciones(layer, d, 'defense', td); result={type:'list', metric: countBy(d,'p'), label:'Acciones def.'}; }
    } else if(state.player){
      if(state.view==='pmap') renderPlayerPassMap(layer, td, state.player);
      else if(state.view==='pzones') renderZones(layer, zonePoints(td, state.player, 'pzones'));
      else if(state.view==='pshots') renderShots(layer, td.shots.filter(s=>inWindow(s.m) && sameShirt(s.p,state.player)), 'pshots', td);
      else if(state.view==='pdefense') renderDuelosRecuperaciones(layer, td.defActions.filter(d=>inWindow(d.m) && sameShirt(d.p,state.player)), 'pdefense', td);
    }
  } else if(isPlayerMode && state.player){
    renderStatSheet(td);
  }

  renderRoster(td, result);
  renderLegend();
  updateTimeReadout();
}

function renderChipRow(){
  const row = document.getElementById('chipRow');
  const cfg = CHIP_CONFIG[state.view];
  row.innerHTML='';
  if(!cfg){ row.style.display='none'; return; }
  row.style.display='flex';
  const hint = document.createElement('span'); hint.className='chip-hint'; hint.textContent='Graficar:';
  row.appendChild(hint);
  const active = activeChips(state.view);
  cfg.options.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'chip' + (active.includes(key) ? ' on':'');
    b.textContent = label;
    b.onclick = ()=>{
      let cur = activeChips(state.view).slice();
      if(cfg.mode==='single'){ cur = [key]; }
      else {
        if(cur.includes(key)){ if(cur.length>1) cur = cur.filter(k=>k!==key); }
        else { cur.push(key); }
      }
      chipState[state.view] = cur;
      render();
    };
    row.appendChild(b);
  });
}

function countBy(arr, key){ const o={}; arr.forEach(x=>{ if(x[key]) o[x[key]]=(o[x[key]]||0)+1; }); return o; }
function posEs(p){
  const map = {'Goalkeeper':'Portero','Defender':'Defensa','Defensive Midfielder':'Mediocampo defensivo','Attacking Midfielder':'Mediocampo ofensivo','Midfielder':'Mediocampo','Striker':'Delantero','Wing Back':'Carrilero','Substitute':'Suplente'};
  return map[p] || p;
}

function renderStatSheet(td){
  const sheet = document.getElementById('statSheet');
  const shirt = state.player;
  const teamFull = (FULLSTATS[state.jornada] && FULLSTATS[state.jornada][state.team]) || {};
  const row = teamFull[shirt] || {};
  let html = '<div class="sheet-grid">';
  STAT_GROUPS.forEach(g=>{
    html += `<div><div class="sheet-group-title">${g.title}</div>`;
    g.keys.forEach(([k,label])=>{
      const v = row[k] || 0;
      let max = 1;
      Object.values(teamFull).forEach(r=>{ if(r[k]>max) max = r[k]; });
      const pct = Math.max(3, Math.round((v/max)*100));
      html += `<div class="sheet-row"><div class="sheet-row-top"><span class="lbl">${label}</span><span class="v">${v}</span></div><div class="sheet-bar-track"><div class="sheet-bar-fill" style="width:${pct}%;"></div></div></div>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  sheet.innerHTML = html;
}

function renderRoster(td, result){
  const list = document.getElementById('rosterList');
  const title = document.getElementById('sideTitle');
  list.innerHTML='';
  const isPlayerMode = state.mode==='jugador';
  let metric = {}, label='Pases';
  if(result && result.metric && result.type!=='network'){ metric = result.metric; label = result.label; }
  else if(result && result.type==='network'){ metric = result.metric; label='Pases'; }
  else { td.passes.filter(p=>inWindow(p.m)).forEach(p=>{ if(p.p) metric[p.p] = (metric[p.p]||0)+1; }); label='Pases'; }

  title.textContent = isPlayerMode ? 'SELECCIONA JUGADOR' : (label.toUpperCase() + ' POR JUGADOR');

  const roster = td.roster;
  const shirts = Object.keys(roster);
  shirts.sort((a,b)=>{
    const va = (result && result.type==='network') ? (metric[a]?metric[a].n:0) : (metric[a]||0);
    const vb = (result && result.type==='network') ? (metric[b]?metric[b].n:0) : (metric[b]||0);
    return vb - va;
  });
  shirts.forEach(shirt=>{
    const raw = metric[shirt];
    const v = (result && result.type==='network') ? (raw?raw.n:0) : (raw||0);
    const role = roleOf(td, shirt);
    const roleTag = role==='gk' ? '<span style="font-family:var(--fnt-mono);font-size:9px;font-weight:700;color:#B9902E;margin-left:4px;">POR</span>'
                    : role==='sub' ? '<span style="font-family:var(--fnt-mono);font-size:9px;font-weight:700;color:#8B93A0;margin-left:4px;">SUP</span>' : '';
    const row = document.createElement('div');
    row.className = 'roster-row' + (isPlayerMode?' clickable':'') + (!isPlayerMode && v===0 ? ' dim':'') + (isPlayerMode && state.player===shirt ? ' selected':'');
    row.innerHTML = `<span class="num">${shirt}</span><span class="nm">${roster[shirt].name}${roleTag}</span><span class="val">${isPlayerMode? '' : (v||'')}</span>`;
    if(isPlayerMode){ row.onclick = ()=>{ state.player = shirt; render(); }; }
    list.appendChild(row);
  });
}

function legendItemsFor(v){
  if(v==='network'){ return [
      {c:NAVY,l:'Titular · tamaño = volumen de pases'},
      {c:NAVY,l:'Suplente (borde punteado)', dashed:true},
      {c:GOLD,l:'Portero (cuadro)', square:true},
    ]; }
  if(v==='zones'||v==='pzones'){ return [{c:'linear',l:'Densidad de acciones (claro → oscuro)'}]; }
  if(v==='shots'||v==='pshots'){ return [
      {c:SHOT_STYLE.goal.fill,l:'Gol'},
      {c:SHOT_STYLE.saved.fill,l:'Atajado'},
      {c:SHOT_STYLE.post.stroke,l:'Poste',ring:true},
      {c:SHOT_STYLE.miss.stroke,l:'Fuera',ring:true},
    ]; }
  if(v==='defense'||v==='pdefense'){ return [
      {c:NAVY,l:'Burbuja = volumen de recuperaciones por zona'},
      {c:WIN,l:'Duelo ganado'}, {c:LOSS,l:'Duelo perdido'},
    ]; }
  if(v==='pmap'){ return [{c:'#1F9D55',l:'Pase completado'},{c:'#D93B3B',l:'Pase fallido'}]; }
  if(v==='ficha'){ return [{c:NAVY,l:'Barra = valor relativo al máximo del equipo en ese partido'}]; }
  return [];
}
function legendItemHtml(it){
  if(it.c==='linear'){ return `<span style="width:44px;height:10px;border-radius:3px;background:linear-gradient(90deg,${mixColor(0)},${mixColor(1)});display:inline-block;"></span>${it.l}`; }
  if(it.square){ return `<span style="width:10px;height:10px;border-radius:2px;background:${it.c};display:inline-block;flex-shrink:0;"></span>${it.l}`; }
  if(it.dashed){ return `<span class="dot" style="background:${it.c};opacity:0.6;border:1.5px dashed #fff;"></span>${it.l}`; }
  return `<span class="dot${it.ring?' ring':''}" style="${it.ring?'border-color:'+it.c:'background:'+it.c}"></span>${it.l}`;
}
function renderLegend(){
  const box = document.getElementById('legendBox');
  box.innerHTML='';
  legendItemsFor(state.view).forEach(it=>{
    const d = document.createElement('div'); d.className='legend-item';
    d.innerHTML = legendItemHtml(it);
    box.appendChild(d);
  });
}

function updateTimeReadout(){
  const t = document.getElementById('timeReadout');

// ==================== CONTROLS ====================
function buildSeg(container, options, activeVal, onSelect){
  container.innerHTML='';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.textContent = opt.label;
    b.dataset.value = opt.value;
    if(opt.value===activeVal) b.classList.add('active');
    b.onclick = ()=>{ onSelect(opt.value); };
    container.appendChild(b);
  });
}
function syncActive(containerId, activeVal){
  const c = document.getElementById(containerId);
  if(!c) return;
  [...c.children].forEach(b=>{ b.classList.toggle('active', b.dataset.value===String(activeVal)); });
}

function autoSelectPlayer(td){
  const counts = {};
  td.passes.forEach(p=>{ if(p.p) counts[p.p]=(counts[p.p]||0)+1; });
  let best=null, bestN=-1;
  Object.entries(counts).forEach(([s,n])=>{ if(n>bestN){bestN=n; best=s;} });
  return best || Object.keys(td.roster)[0];
}

function setupViewTabs(){
  const views = state.mode==='equipo' ? TEAM_VIEWS : PLAYER_VIEWS;
  const validValues = views.map(v=>v[0]);
  if(!validValues.includes(state.view)) state.view = views[0][0];
  buildSeg(document.getElementById('viewTabs'), views.map(v=>({value:v[0],label:v[1]})), state.view, v=>{ state.view=v; render(); });
  document.getElementById('viewTabs').className='view-tabs';
}

function refreshFollowTeamSeg(){
  const teams = teamsInCategory(state.category);
  if(!teams.find(t=>t.id===state.followTeam)) state.followTeam = pickDefaultFollowTeam(state.category);
  buildSeg(document.getElementById('followTeamSeg'), teams.map(t=>({value:t.id, label:t.name})), state.followTeam, v=>{
    state.followTeam = v;
    refreshMatchSeg();
    render();
  });
}

function refreshMatchSeg(){
  const ids = matchesForTeam(state.category, state.followTeam);
  if(!ids.includes(state.jornada)) state.jornada = ids[0];
  state.team = state.followTeam; // the followed team is what loads by default for this match
  refreshTeamSeg();
  buildSeg(document.getElementById('matchSeg'), ids.map(j=>({
    value:j,
    label: DATA[j].label.replace(DATA[j].competition + ' · ', '')
  })), state.jornada, v=>{
    state.jornada=v;
    state.team = state.followTeam;
    refreshTeamSeg();
    if(state.mode==='jugador') state.player = autoSelectPlayer(currentTeamData());

  });
}

  refreshMatchSeg();
  buildSeg(document.getElementById('modeSeg'), [{value:'resumen',label:'Resumen'},{value:'equipo',label:'Equipo'},{value:'jugador',label:'Jugador'}], state.mode, v=>{
    state.mode=v;
    if(v==='jugador' && !state.player) state.player = autoSelectPlayer(currentTeamData());
    if(v!=='resumen') setupViewTabs();
    render();
  });
  setupViewTabs();
}
function refreshTeamSeg(){
  const m = DATA[state.jornada];
  buildSeg(document.getElementById('teamSeg'), m.teamOrder.map(id=>({value:id, label:m.teams[id].name})), state.team, v=>{
    state.team=v;
    if(state.mode==='jugador') state.player = autoSelectPlayer(currentTeamData());
    render();
  });
}

document.getElementById('minFrom').addEventListener('input', e=>{ state.minFrom = Math.min(+e.target.value, state.minTo); render(); });
document.getElementById('minTo').addEventListener('input', e=>{ state.minTo = Math.max(+e.target.value, state.minFrom); render(); });

document.getElementById('playBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('playBtn');
  if(state.playing){ clearInterval(state.playTimer); state.playing=false; btn.textContent='▶'; return; }
  state.playing=true; btn.textContent='❚❚';
  const windowSize = 12;
  state.minFrom = 0; state.minTo = windowSize;
  document.getElementById('minFrom').value = state.minFrom; document.getElementById('minTo').value = state.minTo;
  render();
  state.playTimer = setInterval(()=>{
    state.minFrom += 4; state.minTo = Math.min(98, state.minFrom + windowSize);
    if(state.minFrom > 98){
      clearInterval(state.playTimer); state.playing=false; btn.textContent='▶';
      state.minFrom=0; state.minTo=98;
      document.getElementById('minFrom').value=0; document.getElementById('minTo').value=98;
      render(); return;
    }
    document.getElementById('minFrom').value = state.minFrom; document.getElementById('minTo').value = state.minTo;
    render();
  }, 1400);
});

// ==================== REPORTE PDF INSTITUCIONAL (3 páginas fijas) ====================
// Independiente de lo que esté en pantalla: siempre cubre el partido/equipo actualmente
// seleccionados, de principio a fin (0'-FIN), sin importar el slider de minutos activo.

function svgReport(viewBoxW, viewBoxH){
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', `0 0 ${viewBoxW} ${viewBoxH}`);
  s.setAttribute('xmlns', SVGNS);
  return s;
}

function reportMasthead(subtitle){
  return `<div class="report-head">
    <div class="rh-brand">
      <img src="data:image/png;base64,__LOGO_B64__" alt="Pumas UNAM">
      <div><div class="rh-eyebrow">Inteligencia Deportiva</div><div class="rh-title">Reporte de Partido</div></div>
    </div>
    <div class="rh-meta">${subtitle}</div>
  </div>`;
}

function reportFoot(pageLabel){
  return `<div class="report-foot"><span>PUMAS UNAM · INTELIGENCIA DEPORTIVA</span><span>${pageLabel}</span></div>`;
}

// ---- Página 1: resumen completo de estadísticas de equipo ----
// Recorte a las métricas más importantes de cada categoría — usado ÚNICAMENTE
// al exportar a PDF (Página 1), para que quepa en una sola hoja. La pestaña
// "Resumen" en pantalla sigue mostrando el listado completo (match.categories),
// sin recortar nada.
const REPORT_KEY_WHITELIST = {
  'Posesion y pase': ['possessionPercentage','totalPass','accuratePass','accurateCross','totalThroughBall'],
  'Produccion ofensiva': ['totalScoringAtt','ontargetScoringAtt','attemptsIbox','penAreaEntries','totalAttAssist'],
  'Fase defensiva': ['ballRecovery','interceptionWon','wonTackle','ppda'],
  'Duelos': ['duelWon','duelLost','aerialWon','wonContest'],
  'Disciplina': ['fkFoulLost','totalYellowCard','staffRed','totalOffside'],
  'Portero': ['saves','goalsConceded'],
};

function buildReportPage1(matchId){
  const match = SUMMARY[matchId];
  const [idA, idB] = match.teamOrder;
  const m = DATA[matchId];
  const page = document.createElement('div');
  page.className = 'report-page';
  let html = reportMasthead(`${m.competition}<br>${m.label.replace(m.competition + ' · ', '')}`);
  html += `<div class="report-scoreline">
    <div class="rs-team">${match.teamNames[idA]}</div><div class="rs-score">${scoreText(match, idA, idB)}</div><div class="rs-team">${match.teamNames[idB]}</div>
  </div>`;
  html += `<div class="report-section-title">01 — Resumen de estadísticas</div>
    <div class="report-section-sub">Estadísticas más representativas de cada categoría — la pestaña Resumen en pantalla trae el detalle completo</div>`;
  match.categories.forEach(cat=>{
    const whitelist = REPORT_KEY_WHITELIST[cat.cat];
    const rows = whitelist ? cat.rows.filter(r=>whitelist.includes(r.key)) : cat.rows;
    if(!rows.length) return;
    html += `<div class="resumen-cat-title">${catEs(cat.cat)}</div>`;
    rows.forEach(row=>{
      const va = row[idA] || 0, vb = row[idB] || 0;
      const maxv = Math.max(va, vb, 1);
      const pPct = Math.min(100, (va/maxv)*100), rPct = Math.min(100, (vb/maxv)*100);
      html += `<div class="rrow">
        <div class="rside left"><span class="rval p">${va}</span><div class="rbar-track"><div class="rbar-fill p" style="width:${pPct}%;"></div></div></div>
        <div class="rlabel">${row.label}</div>
        <div class="rside right"><div class="rbar-track"><div class="rbar-fill r" style="width:${rPct}%;"></div></div><span class="rval r">${vb}</span></div>
      </div>`;
    });
  });
  html += reportFoot('Página 1 de 3 — Resumen');
  page.innerHTML = html;
  return page;
}

// ---- Página 2: las 4 gráficas de equipo, partido completo (0'-FIN) ----
function buildReportPage2(matchId, teamId){
  const td = DATA[matchId].teams[teamId];
  const page = document.createElement('div');
  page.className = 'report-page';
  const head = document.createElement('div');
  head.innerHTML = reportMasthead(`${DATA[matchId].competition}<br>${DATA[matchId].label.replace(DATA[matchId].competition + ' · ', '')}`)
    + `<div class="report-section-title">02 — Panorama de equipo · ${td.name}</div>
       <div class="report-section-sub">Partido completo (0'–FIN), no depende del rango de minutos que tengas seleccionado en pantalla</div>`;
  page.appendChild(head);

  // temporarily force the full-match window so the existing render functions
  // (which read state.minFrom/minTo) draw the whole match, then restore it.
  const savedFrom = state.minFrom, savedTo = state.minTo;
  state.minFrom = 0; state.minTo = 98;

  const grid = document.createElement('div');
  grid.className = 'report-grid2';

  const specs = [
    ['network', 'Red de pases', ()=>{ const svg = svgReport(100,65); const layer = drawPitchBase(svg); renderNetwork(layer, td); return svg; }],
    ['zones', 'Campograma', ()=>{ const svg = svgReport(100,65); const layer = drawPitchBase(svg); renderZones(layer, zonePoints(td, null, 'zones')); return svg; }],
    ['shots', 'Disparos', ()=>{ const svg = svgReport(100,65); const layer = drawPitchBase(svg); renderShots(layer, td.shots, 'shots', td); return svg; }],
    ['defense', 'Duelos y recuperaciones', ()=>{ const svg = svgReport(100,65); const layer = drawPitchBase(svg); renderDuelosRecuperaciones(layer, td.defActions, 'defense', td); return svg; }],
  ];
  specs.forEach(([viewKey, label, build])=>{
    const cell = document.createElement('div');
    cell.className = 'report-graphic';
    const title = document.createElement('div'); title.className='rg-title'; title.textContent = label;
    cell.appendChild(title);
    cell.appendChild(build());
    const caption = document.createElement('div'); caption.className='rg-caption';
    caption.textContent = VIEW_CAPTIONS[viewKey] || '';
    cell.appendChild(caption);
    const legend = document.createElement('div'); legend.className='rg-legend';
    legend.innerHTML = legendItemsFor(viewKey).map(it=>`<span class="legend-item">${legendItemHtml(it)}</span>`).join('');
    cell.appendChild(legend);
    grid.appendChild(cell);
  });
  page.appendChild(grid);

  state.minFrom = savedFrom; state.minTo = savedTo;

  const foot = document.createElement('div');
  foot.innerHTML = reportFoot('Página 2 de 3 — Panorama de equipo');
  page.appendChild(foot);
  return page;
}

// ---- Página 3: campograma individual por jugador (pases + heatmap combinados) ----
function buildReportPage3(matchId, teamId){
  const td = DATA[matchId].teams[teamId];
  const page = document.createElement('div');
  page.className = 'report-page';
  const head = document.createElement('div');
  head.innerHTML = reportMasthead(`${DATA[matchId].competition}<br>${DATA[matchId].label.replace(DATA[matchId].competition + ' · ', '')}`)
    + `<div class="report-section-title">03 — Campograma individual · ${td.name}</div>
       <div class="report-section-sub">Pases acertados y no acertados + densidad de actividad por jugador, partido completo</div>`;
  page.appendChild(head);

  const savedFrom = state.minFrom, savedTo = state.minTo;
  state.minFrom = 0; state.minTo = 98;

  const grid = document.createElement('div');
  grid.className = 'report-players-grid';

  const shirts = Object.keys(td.roster)
    .filter(s => td.passes.some(p=>sameShirt(p.p,s)) || td.defActions.some(d=>sameShirt(d.p,s)) || td.shots.some(x=>sameShirt(x.p,s)))
    .sort((a,b)=> parseInt(a,10) - parseInt(b,10));

  shirts.forEach(shirt=>{
    const meta = td.roster[shirt];
    const cell = document.createElement('div');
    cell.className = 'report-player';
    const head2 = document.createElement('div'); head2.className='rp-head';
    head2.innerHTML = `<span class="rp-num">${shirt}</span><div><div class="rp-name">${meta.name}</div><div class="rp-pos">${posEs(meta.pos)}</div></div>`;
    cell.appendChild(head2);

    const pitchWrap = document.createElement('div');
    pitchWrap.className = 'report-player-pitch';
    const pts = zonePoints(td, shirt, 'pzones');
    pitchWrap.appendChild(renderPlayerHeatCanvas(pts, 300, 195));
    const svg = svgReport(100,65);
    const layer = drawPitchLinesOnly(svg);
    renderPlayerPassMap(layer, td, shirt);
    pitchWrap.appendChild(svg);
    cell.appendChild(pitchWrap);
    grid.appendChild(cell);
  });
  page.appendChild(grid);

  state.minFrom = savedFrom; state.minTo = savedTo;

  const legend = document.createElement('div');
  legend.className = 'report-legend';
  legend.innerHTML = `<span><span class="rl-dot" style="background:#2F6B4F;"></span>Pase completado</span>
    <span><span class="rl-dot" style="background:#9C3B34;"></span>Pase fallido</span>
    <span>Fondo: densidad de actividad del jugador (claro → oscuro)</span>`;
  page.appendChild(legend);

  const foot = document.createElement('div');
  foot.innerHTML = reportFoot('Página 3 de 3 — Campograma individual');
  page.appendChild(foot);
  return page;
}

function buildReport(){
  const root = document.getElementById('reportRoot');
  root.innerHTML = `<div class="report-watermark"><img src="data:image/png;base64,__LOGO_B64__" alt=""></div>`;
  const matchId = state.jornada;
  const teamId = state.team;
  root.appendChild(buildReportPage1(matchId));
  root.appendChild(buildReportPage2(matchId, teamId));
  root.appendChild(buildReportPage3(matchId, teamId));
}

document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
  buildReport();
  window.print();
});

setupControls();
render();
</script>
